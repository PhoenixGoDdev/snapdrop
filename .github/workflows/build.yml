name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = ([xml](Get-Content src/SnapDrop/SnapDrop.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build app and installer
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: SnapDrop-Setup-${{ steps.ver.outputs.version }}
          path: artifacts/SnapDrop-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SnapDrop-Setup-*.exe
          generate_release_notes: true
